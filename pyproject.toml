[project]
name = "moonstar-music"
version = "0.1.0"
description = "AI-driven music generation and publishing, client of the Moonstar gateway"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic-settings>=2",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["moonstar_music"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
